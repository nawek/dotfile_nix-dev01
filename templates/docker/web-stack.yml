# Stack web — Nginx reverse proxy + app + BDD
# Usage : cp -r templates/docker/web-stack ~/Projects/mon-projet && cd ~/Projects/mon-projet && docker compose up -d

services:
  # Reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  # Application (adapter l'image)
  app:
    image: node:22-alpine  # ← ADAPTER
    working_dir: /app
    volumes:
      - ./app:/app
    command: npm start      # ← ADAPTER
    environment:
      - DATABASE_URL=postgres://app:secret@db:5432/app
    restart: unless-stopped

  # Base de données
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret  # ← ADAPTER : utiliser un secret en prod
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data:
