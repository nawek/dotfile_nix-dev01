# ║  Secrets — Fichier placeholder (NON CHIFFRÉ)                   ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# ⚠️  CE FICHIER EST UN PLACEHOLDER — NE PAS COMMITER TEL QUEL
#     EN PRODUCTION AVEC DE VRAIS SECRETS !
#
# ── Procédure pour chiffrer ce fichier ─────────────────────────────
#
# 1. S'assurer que .sops.yaml contient votre clé publique age
#
# 2. Générer le hash du mot de passe :
#      mkpasswd -m sha-512 "votre_mot_de_passe"
#
# 3. Éditer et chiffrer les secrets :
#      sops secrets/secrets.yaml
#    → Remplacer les valeurs PLACEHOLDER
#    → Sauvegarder → le fichier est chiffré automatiquement
#
# 4. Vérifier que le fichier est bien chiffré :
#      cat secrets/secrets.yaml  # doit contenir des blocs ENC[...]

# Mot de passe utilisateur (hash SHA-512 généré par mkpasswd)
user-password: "PLACEHOLDER_HASH_MOT_DE_PASSE"

# ← ADAPTER : ajouter vos secrets ici
# github-token: "PLACEHOLDER_GITHUB_TOKEN"
# ssh-private-key: "PLACEHOLDER_SSH_KEY"
